version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sport_manager_dev_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sport_manager
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: